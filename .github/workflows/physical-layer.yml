name: Save monthly Cushing inventory comparison
on:
  workflow_dispatch:
  push:
    branches: [research-october]
    paths: ['.github/workflows/physical-layer.yml']
permissions:
  contents: write
jobs:
  physical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt xlrd pytest
      - run: pytest
      - working-directory: projects/crude-storage-carry
        run: |
          pytest test_model.py test_physical_layer.py
          python run_analysis.py
          python physical_layer.py --download
          pip freeze > outputs/physical_layer/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cushing-physical-layer
          path: projects/crude-storage-carry/outputs/physical_layer
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f projects/crude-storage-carry/data/cushing_weekly_2014_2024.csv projects/crude-storage-carry/outputs/physical_layer
          git diff --cached --quiet || git commit -m "Save EIA Cushing stocks and monthly carry comparison"
          git push
